$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.UI-2.1.0
entities:
  # ---------------------------------------------------------------------------
  # Dashboard — the System Cockpit. rtWellKnownName "cockpit" makes Refinery
  # Studio resolve this entity as the start page after login.
  # 1.1.0 (AB#5558): six columns like the Tenant Cockpit.
  # ---------------------------------------------------------------------------
  - rtId: 69553a0d8b72e7555662012f
    ckTypeId: System.UI/Dashboard-1
    rtWellKnownName: cockpit
    associations: []
    attributes:
      - id: System/Name-1
        value: System Cockpit
      - id: System/Description-1
        # User-facing (1.0.1, AB#5558): shown in UI › MeshBoards and the board manager.
        value: Status of the OctoMesh installation at a glance
      - id: System.UI/Dashboard.Columns-1
        value: 6
      - id: System.UI/Dashboard.RowHeight-1
        value: 200
      - id: System.UI/Dashboard.Gap-1
        value: 16

  # ---------------------------------------------------------------------------
  # Widgets (1.1.0, AB#5558) on the 6-column board:
  #   rows 1-2  Needs attention (attentionList, all checks; on the system tenant
  #             also "Platform services with problems" and "Blueprint updates")
  #   row 3     Tenants | CK models | Blueprint updates          (2 cols each)
  #   row 4     Services healthy | Adapters online | Pipeline executions 24 h
  #   row 5     Version | Error events | Fatal events
  #   rows 6-7  Construction Kit Models pie (3 cols) | Recently opened (3 cols)
  # Every seeded widget REUSES an rtId of the 1.0.x seed (the comment names the
  # former widget), plus one new rtId for "Recently opened": a roll-forward
  # rewrites each seeded entity in place, so no 1.0.x widget is left behind
  # overlapping the new layout. Widgets an operator added are kept.
  # The octo-meshboard cockpit widgets have no data source (dataSourceType
  # static); their Config JSON is exactly what toPersistedConfig writes
  # (checked by cockpit-widget-registrations.spec.ts in octo-frontend-libraries,
  # keep both in step). All values are scalars (AB#5582). Every check runs only
  # for viewers with its roles.
  # ---------------------------------------------------------------------------
  # Was "Health Identity Services" (serviceHealth) up to 1.0.1.
  - rtId: 69553a508b72e75556620131
    ckTypeId: System.UI/DashboardWidget-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: 69553a0d8b72e7555662012f
        targetCkTypeId: System.UI/Dashboard-1
        attributes: []
    attributes:
      - id: System/Name-1
        value: Needs attention
      - id: System.UI/DashboardWidget.Type-1
        value: attentionList
      - id: System.UI/DashboardWidget.Col-1
        value: 1
      - id: System.UI/DashboardWidget.Row-1
        value: 1
      - id: System.UI/DashboardWidget.ColSpan-1
        value: 6
      - id: System.UI/DashboardWidget.RowSpan-1
        value: 2
      - id: System.UI/DashboardWidget.DataSourceType-1
        value: static
      - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId-1
        value: ''
      - id: System.UI/DashboardWidget.Config-1
        value: '{"maxItems":6}'

