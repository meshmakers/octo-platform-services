$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: System.UI.TenantCockpit-1.1.1
description: |
  Service-managed blueprint seeding the default Tenant Cockpit dashboard for every
  non-system tenant. Provides a fixed Refinery Studio start page (rtWellKnownName
  "cockpit") that ships with a CK-model overview tile by default; tenants can extend
  the cockpit with additional widgets after creation.
  1.1.0 (AB#5558) adds the octo-meshboard cockpit widgets: "Needs attention"
  (attentionList), "Adapters online" (adapterStatus), "CK models" (ckModelState)
  and "Pipeline executions 24 h" (pipelineExecutions); the CK-model pie moves to
  rows 3-4. A re-apply rewrites the seeded widgets (position included) and keeps
  widgets the tenant added.
  1.1.1 (AB#5558) replaces the technical board description with a user-facing
  one ("Status of this tenant at a glance"). Auto-applied by the Admin Panel
  service on tenant Enable / startup; the OctoSystem tenant gets
  System.UI.SystemCockpit instead.

  Following the OctoMesh "System.* = service-managed" convention, Studio hides
  Install / Re-apply controls for this blueprint.

ckModelDependencies:
  # Satisfiability floor only. The install/upgrade target is driven by the engine's
  # IServiceManagedCkModelDescriptor (System.UI embedded version), registered in
  # platform-services Program.cs — NOT by this range. Raise the floor only when this
  # blueprint's SEED needs a type/attribute introduced in a specific System.UI version;
  # a plain CK model bump needs no change here.
  - System.UI-[2.2.0,3.0)

seedDataPath: seed-data/entities.yaml

# Apply to every non-system tenant. The companion blueprint
# System.UI.SystemCockpit gates on the opposite value so the AdminPanel service can
# apply both blueprints unconditionally and the runtime picks the right one per tenant.
requires:
  octo.isSystemTenant: "false"
