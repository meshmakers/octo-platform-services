$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.UI-2.1.0
entities:
  # ---------------------------------------------------------------------------
  # Dashboard — the Tenant Cockpit. rtWellKnownName "cockpit" makes Refinery
  # Studio resolve this entity as the start page after login. Tenants may add
  # additional widgets; the blueprint owns the dashboard itself plus the seed
  # widget below.
  # ---------------------------------------------------------------------------
  - rtId: 6a16c4b5d146049b10b3735a
    ckTypeId: System.UI/Dashboard-1
    rtWellKnownName: cockpit
    associations: []
    attributes:
      - id: System/Name-1
        value: Tenant Cockpit
      - id: System/Description-1
        # User-facing (1.1.1, AB#5558): shown in UI › MeshBoards and the board manager.
        value: Status of this tenant at a glance
      - id: System.UI/Dashboard.Columns-1
        value: 6
      - id: System.UI/Dashboard.RowHeight-1
        value: 200
      - id: System.UI/Dashboard.Gap-1
        value: 16

  # ---------------------------------------------------------------------------
  # Default widgets. Layout on the 6-column board (1.1.1, AB#5558):
  #   rows 1-2  Needs attention (attentionList, full width; two rows so up to
  #             six finding cards fit with their action links, 1.1.0 had one)
  #   row 3     Adapters online | CK models | Pipeline executions 24 h (2 cols each)
  #   rows 4-5  Construction Kit Models pie (2 cols)
  # The cockpit widgets have no data source (dataSourceType static); their
  # Config JSON is exactly what octo-meshboard's toPersistedConfig writes
  # (checked by cockpit-widget-registrations.spec.ts in octo-frontend-libraries,
  # keep both in step). Every check runs only for viewers with its roles.
  # ---------------------------------------------------------------------------
  - rtId: 6a16c515d146049b10b3735b
    ckTypeId: System.UI/DashboardWidget-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: 6a16c4b5d146049b10b3735a
        targetCkTypeId: System.UI/Dashboard-1
        attributes: []
    attributes:
      - id: System/Name-1
        value: Construction Kit Models
      - id: System.UI/DashboardWidget.Type-1
        value: pieChart
      - id: System.UI/DashboardWidget.Col-1
        value: 1
      - id: System.UI/DashboardWidget.Row-1
        value: 4
      - id: System.UI/DashboardWidget.ColSpan-1
        value: 2
      - id: System.UI/DashboardWidget.RowSpan-1
        value: 2
      - id: System.UI/DashboardWidget.DataSourceType-1
        value: constructionKitQuery
      - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId-1
        value: ''
      - id: System.UI/DashboardWidget.Config-1
        value: '{"chartType":"pie","categoryField":"","valueField":"","showLabels":false,"showLegend":true,"legendPosition":"right","ckQueryTarget":"models","ckGroupBy":"modelState"}'

  - rtId: 6a16c515d146049b10b3735c
    ckTypeId: System.UI/DashboardWidget-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: 6a16c4b5d146049b10b3735a
        targetCkTypeId: System.UI/Dashboard-1
        attributes: []
    attributes:
      - id: System/Name-1
        value: Needs attention
      - id: System.UI/DashboardWidget.Type-1
        value: attentionList
      - id: System.UI/DashboardWidget.Col-1
        value: 1
      - id: System.UI/DashboardWidget.Row-1
        value: 1
      - id: System.UI/DashboardWidget.ColSpan-1
        value: 6
      - id: System.UI/DashboardWidget.RowSpan-1
        value: 2
      - id: System.UI/DashboardWidget.DataSourceType-1
        value: static
      - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId-1
        value: ''
      - id: System.UI/DashboardWidget.Config-1
        value: '{"maxItems":6}'

  - rtId: 6a16c515d146049b10b3735d
    ckTypeId: System.UI/DashboardWidget-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: 6a16c4b5d146049b10b3735a
        targetCkTypeId: System.UI/Dashboard-1
        attributes: []
    attributes:
      - id: System/Name-1
        value: Adapters online
      - id: System.UI/DashboardWidget.Type-1
        value: adapterStatus
      - id: System.UI/DashboardWidget.Col-1
        value: 1
      - id: System.UI/DashboardWidget.Row-1
        value: 3
      - id: System.UI/DashboardWidget.ColSpan-1
        value: 2
      - id: System.UI/DashboardWidget.RowSpan-1
        value: 1
      - id: System.UI/DashboardWidget.DataSourceType-1
        value: static
      - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId-1
        value: ''
      - id: System.UI/DashboardWidget.Config-1
        value: '{"showDetail":true}'

  - rtId: 6a16c515d146049b10b3735e
    ckTypeId: System.UI/DashboardWidget-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: 6a16c4b5d146049b10b3735a
        targetCkTypeId: System.UI/Dashboard-1
        attributes: []
    attributes:
      - id: System/Name-1
        value: CK models
      - id: System.UI/DashboardWidget.Type-1
        value: ckModelState
      - id: System.UI/DashboardWidget.Col-1
        value: 3
      - id: System.UI/DashboardWidget.Row-1
        value: 3
      - id: System.UI/DashboardWidget.ColSpan-1
        value: 2
      - id: System.UI/DashboardWidget.RowSpan-1
        value: 1
      - id: System.UI/DashboardWidget.DataSourceType-1
        value: static
      - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId-1
        value: ''
      - id: System.UI/DashboardWidget.Config-1
        value: '{"showDetail":true}'

  - rtId: 6a16c515d146049b10b3735f
    ckTypeId: System.UI/DashboardWidget-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: 6a16c4b5d146049b10b3735a
        targetCkTypeId: System.UI/Dashboard-1
        attributes: []
    attributes:
      - id: System/Name-1
        value: Pipeline executions 24 h
      - id: System.UI/DashboardWidget.Type-1
        value: pipelineExecutions
      - id: System.UI/DashboardWidget.Col-1
        value: 5
      - id: System.UI/DashboardWidget.Row-1
        value: 3
      - id: System.UI/DashboardWidget.ColSpan-1
        value: 2
      - id: System.UI/DashboardWidget.RowSpan-1
        value: 1
      - id: System.UI/DashboardWidget.DataSourceType-1
        value: static
      - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId-1
        value: ''
      - id: System.UI/DashboardWidget.Config-1
        value: '{"showDetail":true,"showSparkline":true}'
