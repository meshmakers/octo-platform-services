$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
# System.UI.EntityForms seed (AB#5521). Service-managed: platform-services applies it to
# every tenant and a re-apply upserts these entities by rtId — edit the seed, not the
# tenant copy. Tenants override a form by creating their OWN System.UI/EntityForm for
# the same TargetCkTypeId (tenant forms win over seeded ones before Priority is compared).
#
# TargetCkTypeId is a plain string, so targeting System.Communication types needs no
# dependency on that model; a form whose type is absent in a tenant simply never
# resolves.
#
# AttributePath convention: CK attribute names (Name, Host, RtBlueprintSource, ...) plus
# the entity system properties rtWellKnownName / rtChangedDateTime.
#
# Fixed rtIds 6703000000000000000000xx: 01 = form-default, 1x = wave-1 connection forms,
# 2x = wave-3 connection forms (1.1.0).
dependencies:
  # 2.7.0 introduces System.UI/EntityForm + its records; keep in step with the
  # ckModelDependencies floor in blueprint.yaml.
  - System.UI-2.7.0
entities:
  # ---------------------------------------------------------------------------
  # form-default — the end of the resolution chain. Targets System/Entity with
  # IncludeDerivedTypes = true and the lowest Priority, so every type that has no
  # form of its own (and no closer base-type form) resolves to this one. It only
  # shapes the common header (well-known name, Name, Description) and the
  # engine-stamped blueprint provenance; everything else is generated from CK
  # metadata into the 'Attributes' section.
  # ---------------------------------------------------------------------------
  - rtId: '670300000000000000000001'
    ckTypeId: System.UI/EntityForm
    rtWellKnownName: form-default
    attributes:
      - { id: System/Name, value: "Default form" }
      - { id: System/Description, value: "Fallback form for every entity type without a form of its own. Seeded by platform-services; create a tenant EntityForm for a type to override it." }
      - { id: System.UI/EntityForm.TargetCkTypeId, value: "System/Entity" }
      - { id: System.UI/EntityForm.IncludeDerivedTypes, value: true }
      - { id: System.UI/EntityForm.Priority, value: 0 }
      - { id: System.UI/EntityForm.CanCreate, value: true }
      - { id: System.UI/EntityForm.CanEdit, value: true }
      - { id: System.UI/EntityForm.CanDelete, value: true }
      - { id: System.UI/EntityForm.CanDuplicate, value: false }
      - { id: System.UI/EntityForm.CanExport, value: true }
      - { id: System.UI/EntityForm.GenerateRemainingFields, value: true }
      - { id: System.UI/EntityForm.GeneratedSectionTitle, value: "Attributes" }
      - id: System.UI/EntityForm.Sections
        value:
        - ckRecordId: System.UI/EntityFormSection
          attributes:
          - { id: System.UI/EntityFormSection.Key, value: "general" }
          - { id: System.UI/EntityFormSection.Title, value: "General" }
          - { id: System.UI/EntityFormSection.Order, value: 0 }
          - { id: System.UI/EntityFormSection.Columns, value: 2 }
        - ckRecordId: System.UI/EntityFormSection
          attributes:
          - { id: System.UI/EntityFormSection.Key, value: "system" }
          - { id: System.UI/EntityFormSection.Title, value: "System" }
          - { id: System.UI/EntityFormSection.Description, value: "Blueprint provenance stamped by the engine when a blueprint seeded this entity." }
          - { id: System.UI/EntityFormSection.Order, value: 99 }
          - { id: System.UI/EntityFormSection.Collapsed, value: true }
      - id: System.UI/EntityForm.Fields
        value:
        - ckRecordId: System.UI/EntityFormField
          attributes:
          - { id: System.UI/EntityFormField.AttributePath, value: "rtWellKnownName" }
          - { id: System.UI/EntityFormField.SectionKey, value: "general" }
          - { id: System.UI/EntityFormField.Order, value: 0 }
          - { id: System.UI/EntityFormField.Label, value: "Well-known name" }
          - { id: System.UI/EntityFormField.Help, value: "Stable, tenant-unique handle other entities, pipelines and the Studio use to find this entity. Cannot be changed after creation." }
          - { id: System.UI/EntityFormField.ReadOnly, value: "afterCreate" }
        - ckRecordId: System.UI/EntityFormField
          attributes:
          - { id: System.UI/EntityFormField.AttributePath, value: "Name" }
          - { id: System.UI/EntityFormField.SectionKey, value: "general" }
          - { id: System.UI/EntityFormField.Order, value: 1 }
          - { id: System.UI/EntityFormField.Width, value: "half" }
        - ckRecordId: System.UI/EntityFormField
          attributes:
          - { id: System.UI/EntityFormField.AttributePath, value: "Description" }
          - { id: System.UI/EntityFormField.SectionKey, value: "general" }
          - { id: System.UI/EntityFormField.Order, value: 2 }
          - { id: System.UI/EntityFormField.Editor, value: "multiline" }
        - ckRecordId: System.UI/EntityFormField
          attributes:
          - { id: System.UI/EntityFormField.AttributePath, value: "RtBlueprintSource" }
          - { id: System.UI/EntityFormField.SectionKey, value: "system" }
          - { id: System.UI/EntityFormField.Order, value: 0 }
          - { id: System.UI/EntityFormField.Label, value: "Blueprint source" }
          - { id: System.UI/EntityFormField.Help, value: "Blueprint that seeded this entity." }
          - { id: System.UI/EntityFormField.ReadOnly, value: "always" }
        - ckRecordId: System.UI/EntityFormField
          attributes:
          - { id: System.UI/EntityFormField.AttributePath, value: "RtBlueprintLocked" }
          - { id: System.UI/EntityFormField.SectionKey, value: "system" }
          - { id: System.UI/EntityFormField.Order, value: 1 }
          - { id: System.UI/EntityFormField.Label, value: "Blueprint locked" }
          - { id: System.UI/EntityFormField.Help, value: "Whether the blueprint still manages this entity (a re-apply overwrites it); false keeps it as user data." }
          - { id: System.UI/EntityFormField.ReadOnly, value: "always" }
        - ckRecordId: System.UI/EntityFormField
          attributes:
          - { id: System.UI/EntityFormField.AttributePath, value: "RtBlueprintAppliedAt" }
          - { id: System.UI/EntityFormField.SectionKey, value: "system" }
          - { id: System.UI/EntityFormField.Order, value: 2 }
          - { id: System.UI/EntityFormField.Label, value: "Blueprint applied at" }
          - { id: System.UI/EntityFormField.Help, value: "When the blueprint last wrote this entity." }
          - { id: System.UI/EntityFormField.ReadOnly, value: "always" }
      - id: System.UI/EntityForm.ListColumns
        value:
        - ckRecordId: System.UI/EntityFormColumn
          attributes:
          - { id: System.UI/EntityFormColumn.AttributePath, value: "rtWellKnownName" }
          - { id: System.UI/EntityFormColumn.Label, value: "Name" }
        - ckRecordId: System.UI/EntityFormColumn
          attributes:
          - { id: System.UI/EntityFormColumn.AttributePath, value: "Name" }
        - ckRecordId: System.UI/EntityFormColumn
          attributes:
          - { id: System.UI/EntityFormColumn.AttributePath, value: "rtChangedDateTime" }
          - { id: System.UI/EntityFormColumn.Label, value: "Changed" }
          - { id: System.UI/EntityFormColumn.Display, value: "date" }

