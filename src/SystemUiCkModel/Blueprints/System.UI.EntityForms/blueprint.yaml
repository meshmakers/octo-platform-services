$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: System.UI.EntityForms-1.5.0
description: |
  Service-managed blueprint seeding the platform's System.UI/EntityForm entities
  (AB#5521) on every tenant. Ships "form-default" — the form on System/Entity with
  IncludeDerivedTypes and the lowest Priority that ends the Refinery Studio's form
  resolution chain, so every type has a form — plus the wave-1 configuration forms
  (SFTP, Grafana, Discord, Loxone, e-mail sender, e-mail receiver) that replace the
  hand-written Studio configuration pages. 1.1.0 (AB#5523) adds the wave-3 forms
  WeClapp, EDA and Energy Community (Settings › Connections). 1.2.0 (AB#5524) adds
  the wave-2 forms SAP, Microsoft Graph, finAPI, Helm repository and Service accounts
  (Connections), AI configuration, AI agent configuration and AI quota limit (AI), and
  the wave-4 forms Tenant mode (singleton "TenantMode") and Tenant configuration
  (Tenant).
  1.3.0 (AB#5547) adds the detail forms of the communication runtime objects Adapter,
  Pool, Application and Data flow (no Settings category; they shape the detail pages):
  controller / operator runtime state is listed Hidden, attributes of derived types
  are generated under "Further attributes".
  1.4.0 (AB#5547) sets ReferenceDisplayAttributes (repositoryUrl, channel) on the
  Helm repository picker of the adapter and application forms (System.UI 2.9.0).
  1.4.1 (AB#5528) raises the System.UI floor to 2.9.0 (wave-1 System 2.5.0 repin;
  the studio-rebuild System.UI versions moved one minor up behind the 2.7.0 repin
  release). The forms are unchanged.
  1.5.0 (AB#5884) makes the communication detail forms work on System.Communication
  3.x AND 4.x (4.0.0 renamed Pool -> DeploymentSite, Manages/ManagedBy -> Hosts/HostedBy):
  the adapter and application forms gain a HostedBy (DeploymentSite, role Hosts) field
  next to the existing ManagedBy (Pool, role Manages) field — the Studio skips a field
  whose association role is absent from the tenant's type, so exactly one renders — and
  the new form-deployment-site targets System.Communication/DeploymentSite (TargetCkTypeId
  is a single type id, so form-pool keeps its stable name and stays unchanged for 3.x).

  Target types are referenced by their CK type id as a plain string
  (TargetCkTypeId), so this blueprint needs no System.Communication dependency; a
  form whose type is absent in a tenant simply never resolves — which is what lets
  form-pool (3.x) and form-deployment-site (4.x) ship side by side.

  Tenants customise a form by creating their OWN EntityForm for the same
  TargetCkTypeId — tenant forms win over these seeded ones. Do not edit the seeded
  entities in a tenant: platform-services re-applies this blueprint on tenant
  lifecycle events and the re-apply upserts them by rtId.

  Following the OctoMesh "System.* = service-managed" convention, Studio hides
  Install / Re-apply controls for this blueprint.

ckModelDependencies:
  # Satisfiability floor only. The install/upgrade target is driven by the engine's
  # IServiceManagedCkModelDescriptor (System.UI embedded version), registered in
  # platform-services Program.cs — NOT by this range. 2.8.0 is the first System.UI
  # version carrying System.UI/EntityForm and its records, 2.9.0 the first with
  # EntityFormField.ReferenceDisplayAttributes (seeded since 1.4.0); keep in step
  # with the seed-data/entities.yaml `dependencies`.
  - System.UI-[2.9.0,3.0)

seedDataPath: seed-data/entities.yaml

# No `requires:` block on purpose: the forms apply to the system tenant and every
# child tenant alike.
