"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
attributes:
  # Folder attributes
  - id: Folder.Scope
    valueType: String
    description: Library section the folder belongs to (e.g. "Queries"). Folders of different scopes form separate trees.

  - id: Folder.SortOrder
    valueType: Int
    description: Optional position of the folder among its siblings (ascending); folders without a value sort by name.
