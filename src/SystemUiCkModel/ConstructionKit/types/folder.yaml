"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: Folder
    derivedFromCkTypeId: ${this}/UIElement
    isFinal: false
    isAbstract: false
    description: A folder of the Studio's library. Folders nest through FolderParent (top-level folders have no parent) and hold items (e.g. persistent queries) through FolderItem. Deleting a folder does not cascade - clients must move its subfolders and items up to the parent first.
    attributes:
      - id: ${System}/Name
        name: Name
      - id: ${System}/Description
        name: Description
        isOptional: true
      - id: ${this}/Folder.Scope
        name: Scope
      - id: ${this}/Folder.SortOrder
        name: SortOrder
        isOptional: true
    associations:
      - id: ${this}/FolderParent
        targetCkTypeId: ${this}/Folder
      - id: ${this}/FolderItem
        targetCkTypeId: ${System}/PersistentQuery
