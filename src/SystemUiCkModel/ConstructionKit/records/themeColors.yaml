"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
records:
  # DEPRECATED, see attributes/attributes-theme-legacy.yaml. Same shape as in System.UI 2.0.0.
  - recordId: Theme.Colors
    description: "DEPRECATED (use ThemePalette). Theme information for an app."
    attributes:
      - id: ${this}/PrimaryColor
        name: PrimaryColor
      - id: ${this}/SecondaryColor
        name: SecondaryColor
      - id: ${this}/TertiaryColor
        name: TertiaryColor
      - id: ${this}/NeutralColor
        name: NeutralColor
